name: Build and Deploy TurboWarp Game

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Game (With Custom Extension Code)
        run: |
          # Wir schreiben den Extension-Code aus den Secrets in eine temporäre Datei
          echo "${{ secrets.CUSTOM_EXTENSION_DATA }}" > extension.js

          # Richtige npx-Syntax: Erst das Paket laden, dann mit -c den Befehl ausführen
          npx -y -p @turbowarp/packager npx tw-packager Hasan-Gambling.sb3 \
            --output dist/index.html \
            --target web \
            --assets-dir assets \
            --compress \
            --custom-js extension.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
