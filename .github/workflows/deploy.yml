name: Build and Deploy TurboWarp Game

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Schritt 1: Wir installieren den originalen Packager global auf dem Server
      - name: Install TurboWarp Packager
        run: npm install -g @turbowarp/packager

      # Schritt 2: Jetzt bauen wir das Spiel mit deiner Custom Extension
      - name: Build Game (With Custom Extension Code)
        run: |
          # Wir schreiben den Extension-Code aus den Secrets in eine Datei
          echo "${{ secrets.CUSTOM_EXTENSION_DATA }}" > extension.js

          # Da es jetzt global installiert ist, rufen wir es einfach direkt auf
          tw-packager Hasan-Gambling.sb3 \
            --output dist/index.html \
            --target web \
            --assets-dir assets \
            --compress \
            --custom-js extension.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
