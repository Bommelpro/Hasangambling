name: Build and Deploy TurboWarp Game

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

       Tar-Build mit mehreren einzelnen Extensions
      - name: Build Standalone Game
        run: |
          mkdir -p dist

          # 1. Hier schreiben wir jede Extension in ihre eigene Datei
          echo "${{ secrets.AUDIO_EXTENSION }}" > audio.js
          echo "${{ secrets.GRAPHICS_EXTENSION }}" > graphics.js
          echo "${{ secrets.MULTIPLAYER_EXTENSION }}" > multiplayer.js

          # 2. Wir übergeben die Dateien als kommagetrennte Liste an --custom-js
          npx --package=@turbowarp/packager tw-packager Hasan-Gambling.sb3 \
            --output dist/index.html \
            --target web \
            --compress \
            --custom-js audio.js,graphics.js,multiplayer.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
