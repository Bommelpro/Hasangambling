name: Build and Deploy TurboWarp Game

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # SCHRITT 1: Wir installieren das Paket lokal
      - name: Install TurboWarp Packager (Local)
        run: npm install @turbowarp/packager

      # SCHRITT 2: Wir bauen das Spiel
      - name: Build Game (With Custom Extension Code)
        run: |
          # Wir schreiben den Extension-Code aus den Secrets in eine Datei
          echo "${{ secrets.CUSTOM_EXTENSION_DATA }}" > extension.js

          # Direkter Pfad zur Datei – kein npx, keine Internet-Suche, kein 404 mehr!
          ./node_modules/.bin/tw-packager Hasan-Gambling.sb3 \
            --output dist/index.html \
            --target web \
            --assets-dir assets \
            --compress \
            --custom-js extension.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
