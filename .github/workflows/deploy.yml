name: Build and Deploy TurboWarp Game

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Game (With Custom Extension)
        run: |
          # Wir übergeben deine Extension als Text-URL direkt an den Packager
          npx -y turbowarp-packager-cli \
            -i Hasan-Gambling.sb3 \
            -o dist \
            --extension "${{ secrets.CUSTOM_EXTENSION_DATA }}"

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
