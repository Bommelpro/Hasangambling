name: Build and Deploy TurboWarp Game

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Standalone Game
        run: |
          # 1. Erstelle den Zielordner
          mkdir -p dist

          # 2. Schreibe den Extension-Code aus den Secrets in eine JavaScript-Datei
          echo "${{ secrets.CUSTOM_EXTENSION_DATA }}" > extension.js

          # 3. Baue das Spiel mit dem offiziellen Paket über die sichere npx-Syntax
          npx --package=@turbowarp/packager tw-packager Hasan-Gambling.sb3 \
            --output dist/index.html \
            --target web \
            --compress \
            --custom-js extension.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
