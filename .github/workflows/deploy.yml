name: Build and Deploy TurboWarp Game

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Game (With Custom Extension Code)
        run: |
          # Wir schreiben das Secret temporär in eine .js Datei, damit tw-packager es lesen kann
          echo "${{ secrets.CUSTOM_EXTENSION_DATA }}" > extension.js

          # Über --custom-js binden wir den Erweiterungscode sauber in das fertige Spiel ein
          npx -y --package @turbowarp/packager tw-packager Hasan-Gambling.sb3 \
            --output dist/index.html \
            --target web \
            --assets-dir assets \
            --compress \
            --custom-js extension.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
