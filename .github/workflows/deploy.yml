name: Build and Deploy TurboWarp Game

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Game (Splitted & Compressed)
        run: |
          # Ganz normal ohne falsche Optionen bauen
          npx -y turbowarp-packager-cli -i Hasan-Gambling.sb3 -o dist

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Lädt den Inhalt von dist direkt ins Hauptverzeichnis hoch
          branch: gh-pages
