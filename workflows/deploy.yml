name: Build and Deploy TurboWarp Game

on:
  push:
    branches:
      - main # Oder wie dein Haupt-Branch heißt (z.B. master)

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'

      - name: Install TurboWarp Packager & Optimizers
        run: |
          npm install -g @turbowarp/packager
          npm install -g svgo image-min # Für automatische Bildkompression

      - name: Build Game (Splitted & Compressed)
        run: |
          # Erstellt einen Ordner 'dist' mit getrennten, komprimierten Assets
          tw-packager spiel.sb3 \
            --output dist/index.html \
            --target web \
            --assets-dir assets \
            --compress

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Lädt nur den optimierten Output hoch
          branch: gh-pages # Der Branch, von dem GitHub Pages liest
